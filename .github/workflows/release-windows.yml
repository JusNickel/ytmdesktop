name: Windows AdBlock Release

on:
  workflow_dispatch:
  push:
    branches:
      - "release/windows-*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'JusNickel/ytmdesktop'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
      - name: Test playback helper
        run: pnpm test:adblock
      - name: Build Windows x64 installer
        run: pnpm make --platform win32 --arch x64
      - name: Verify packaged blocker
        shell: pwsh
        run: |
          pnpm test:adblock:packaged
          if ($LASTEXITCODE -ne 0) { throw "Packaged blocker test failed" }
          $result = Get-Content .verification/packaged-runtime-result.json -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "Packaged blocker verification failed" }
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = "out/make/squirrel.windows/x64/YouTube-Music-AdBlock-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer missing" }
          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  YouTube-Music-AdBlock-Setup.exe" | Set-Content -Encoding utf8NoBOM "out/make/squirrel.windows/x64/SHA256SUMS.txt"
          gh release create $tag $installer "out/make/squirrel.windows/x64/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "YouTube Music AdBlock $version" --notes-file .github/windows-release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
